services:
  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      CORS_ORIGINS: ${PUBLIC_WEB_URL:-http://localhost:3000}
    volumes:
      - shop-data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - api
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  shop-data:
